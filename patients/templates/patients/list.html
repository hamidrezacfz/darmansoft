<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>پذیرش | درمان‌سافت</title><body style="font-family:Tahoma;background:#f4f7fb;padding:40px;color:#172033"><p><a href="/">← خانه</a></p><h1>پذیرش و بیماران</h1><form method="post" style="background:white;padding:20px;max-width:500px">{% csrf_token %}{{ form.as_p }}<button>ثبت بیمار</button></form><h2>بیماران ثبت‌شده</h2><table style="background:white;border-collapse:collapse;width:100%;max-width:800px"><tr><th>نام</th><th>کد ملی</th><th>تلفن</th></tr>{% for patient in patients %}<tr><td>{{ patient }}</td><td>{{ patient.national_id }}</td><td>{{ patient.mobile|default:'—' }}</td></tr>{% empty %}<tr><td colspan="3">هنوز بیماری ثبت نشده است.</td></tr>{% endfor %}</table></body></html>
