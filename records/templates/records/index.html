<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>پرونده بیمار</title><body style="font-family:Tahoma;background:#f4f7fb;padding:40px"><p><a href="/">← خانه</a></p><h1>پرونده بیمار</h1><form method="post" style="background:white;padding:20px;max-width:550px">{% csrf_token %}{{form.as_p}}<button>ثبت در پرونده</button></form><h2>آخرین ثبت‌ها</h2>{% for x in records %}<article style="background:white;padding:14px;margin:10px 0"><b>{{x.patient}}</b> — {{x.complaint}}<br>تشخیص: {{x.diagnosis|default:'—'}}<br>{{x.notes}}</article>{% empty %}<p>پرونده‌ای ثبت نشده است.</p>{% endfor %}</body></html>
