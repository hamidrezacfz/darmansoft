<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>گزارش مستردی‌ها</title><style>body{font-family:Tahoma;background:#f3f7f7;padding:25px;color:#18323a}.box{background:#fff;padding:18px;border-radius:14px;margin:auto;max-width:1000px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e5eeee;text-align:right}button{padding:9px 16px;background:#147d70;color:#fff;border:0;border-radius:7px}@media print{button,a{display:none}}</style><main class="box"><p><a href="/billing/report/">← گزارش صندوق</a></p><h1>گزارش مستردی‌ها</h1><p>تعداد: <b>{{count}}</b> | جمع مستردی: <b>{{total}} ریال</b></p><button onclick="window.print()">چاپ / ذخیره PDF</button><table><tr><th>بیمار</th><th>خدمت</th><th>مبلغ</th><th>کاربر</th><th>شرح</th><th>تاریخ</th></tr>{% for x in refunds %}<tr><td>{{x.payment.patient}}</td><td>{{x.payment.admission.service}}</td><td>{{x.amount}} ریال</td><td>{{x.refunded_by|default:'—'}}</td><td>{{x.note}}</td><td>{{x.created_at}}</td></tr>{% empty %}<tr><td colspan="6">موردی ثبت نشده است.</td></tr>{% endfor %}</table></main>
