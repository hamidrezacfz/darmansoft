<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>تأیید ثبت پذیرش</title><style>body{font-family:Tahoma;background:#f3f7f8;color:#18323a}.box{max-width:580px;margin:50px auto;padding:25px;background:#fff;border:1px solid #dce8e7;border-radius:16px}.warn{background:#fff4d9;padding:12px;border-radius:8px}.btn{padding:11px 16px;border:0;border-radius:8px;font-family:inherit;font-weight:bold;cursor:pointer}.ok{background:#147d70;color:#fff}.cancel{background:#eee;color:#333;text-decoration:none;margin-right:8px}</style><main class="box"><h1>تأیید ثبت پذیرش</h1><p class="warn">اطلاعات را بررسی کنید. فقط پس از تأیید، کد ارجاع صادر می‌شود.</p><form method="post">{% csrf_token %}{{form.as_p}}<input type="hidden" name="confirmed" value="1"><button class="btn ok">تأیید و صدور کد ارجاع</button><a class="btn cancel" href="/reception/">لغو</a></form></main></html>
