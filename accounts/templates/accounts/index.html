<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>کاربران</title><style>*{box-sizing:border-box}body{font-family:Tahoma;background:#f3f7f8;padding:24px;color:#18323a}.wrap{max-width:1250px;margin:auto}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:18px;align-items:start}.card{background:#fff;padding:20px;border-radius:14px;border:1px solid #dfe9e9}.user-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}.user-form p{margin:0;min-width:0}.user-form p:nth-of-type(4),.user-form p:nth-of-type(5){grid-column:1/-1}.user-form p:nth-of-type(4) ul,.user-form p:nth-of-type(5) ul{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px 12px;list-style:none;padding:10px;margin:5px 0;background:#f5f9f9;border-radius:8px}.user-form p:nth-of-type(4) li,.user-form p:nth-of-type(5) li{display:flex;align-items:center;justify-content:flex-start;gap:7px;white-space:nowrap;line-height:1.8}.user-form p:nth-of-type(4) input[type=checkbox],.user-form p:nth-of-type(5) input[type=checkbox]{width:17px;height:17px;margin:0;flex:0 0 17px}.user-form input:not([type=checkbox]),.user-form select{width:95%;padding:8px;margin:3px}.user-form button{grid-column:1/-1;width:max-content}.edit{background:#147d70;color:#fff;border:0;border-radius:7px;padding:9px 14px;text-decoration:none;cursor:pointer}.row{border-bottom:1px solid #e5eeee;padding:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}.hint{color:#6d8183;font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}.user-form p:nth-of-type(4) ul,.user-form p:nth-of-type(5) ul{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.user-form{grid-template-columns:1fr}.user-form p:nth-of-type(4) ul,.user-form p:nth-of-type(5) ul{grid-template-columns:1fr}}</style><main class="wrap"><p><a href="/definitions/">← تعریف پایه</a></p><h1>کاربران و دسترسی‌ها</h1><section class="layout"><form class="card user-form" method="post">{% csrf_token %}{{form.as_p}}<button>{% if edit_profile %}ذخیره تغییرات{% else %}ساخت کاربر{% endif %}</button>{% if edit_profile %}<a href="/definitions/users/">انصراف</a>{% endif %}</form><section class="card"><h2>کاربران ثبت‌شده</h2><p class="hint">برای تغییر نقش، پنل یا دسترسی، روی ویرایش بزنید.</p>{% for item in users %}<div class="row"><span>{{item.user.username}}<br><small>{{item.get_role_display}}</small></span><a class="edit" href="?edit={{item.pk}}">ویرایش</a></div>{% empty %}<p>کاربری ثبت نشده است.</p>{% endfor %}</section></section></main></html>
