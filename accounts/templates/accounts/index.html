<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>کاربران</title><body style="font-family:Tahoma;background:#f3f7f8;padding:35px"><p><a href="/definitions/">← تعریف پایه</a></p><h1>کاربران و دسترسی‌ها</h1><form method="post" style="background:white;padding:20px;max-width:450px">{% csrf_token %}{{form.as_p}}<button>ساخت کاربر</button></form><h2>کاربران ثبت‌شده</h2><table><tr><th>نام کاربری</th><th>سطح دسترسی</th></tr>{% for item in users %}<tr><td>{{item.user.username}}</td><td>{{item.get_role_display}}</td></tr>{% empty %}<tr><td colspan="2">کاربری ثبت نشده است.</td></tr>{% endfor %}</table></body></html>
