<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>ورود به درمان‌سافت</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#edf5f4;font-family:Tahoma}.box{background:white;padding:34px;border-radius:18px;width:330px;box-shadow:0 12px 30px #17375c20}h1{font-size:23px}label,input{display:block;width:100%;margin:10px 0}input{padding:10px;box-sizing:border-box;border:1px solid #d7e2e4;border-radius:8px}button{width:100%;padding:11px;border:0;border-radius:8px;background:#147d70;color:white;font-family:inherit}</style><body><form class="box" method="post">{% csrf_token %}<h1>ورود به درمان‌سافت</h1><label>نام کاربری</label><input name="username" autofocus><label>رمز عبور</label><input type="password" name="password"><p style="color:#b42318;font-size:12px">{{error}}</p><button>ورود</button></form></body></html>
